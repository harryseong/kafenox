name: Kafenox
options:
  bundleIdPrefix: com.harryseong.kafenox
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Build settings live in Config/*.xcconfig, not here and not in the Xcode
# inspector, so they diff readably.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Core:
    path: ../Packages/Core
  DesignSystem:
    path: ../Packages/DesignSystem
  Networking:
    path: ../Packages/Networking
  Features:
    path: ../Packages/Features

targets:
  Kafenox:
    type: application
    platform: iOS
    # The app target is deliberately thin: @main, the composition root, and
    # the tab shell. Real code lives in ../Packages.
    sources:
      - path: Kafenox
        excludes:
          - Info.plist
    dependencies:
      - package: Core
        product: KafenoxCore
      - package: DesignSystem
        product: KafenoxDesignSystem
      - package: Networking
        product: KafenoxNetworking
      - package: Features
        product: KafenoxFeatures
    info:
      path: Kafenox/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Kafenox uses your camera to photograph coffee bag labels so it can extract the coffee details automatically."
        # Read once by AppConfiguration; fed from Config/*.xcconfig.
        API_BASE_URL: $(API_BASE_URL)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
